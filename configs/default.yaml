seed: 42
data:
  root: './data'
  batch_size: 32
  num_workers: 0
  val_ratio: 0.2

model:
  name: 'resnet18'          # resnet18 | googlenet | efficientnet_b0
  pretrained: false         # true для дообучения
  freeze_backbone: false
  unfreeze_layers: null     # 'layer4' для resnet, 'features[5:]' для efficientnet

training:
  epochs: 30
  lr: 0.001
  patience: 5
  save_dir: './artifacts'
